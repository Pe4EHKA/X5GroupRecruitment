# Test profile configuration
spring.application.name=x5-recruitment-system-test

# Database - use in-memory H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway - disable for tests (we use ddl-auto=create-drop)
spring.flyway.enabled=false

# Disable dev data initializer for tests
spring.autoconfigure.exclude=com.x5.recruitment.infrastructure.config.DevDataInitializer

# Disable mail
spring.mail.host=localhost
management.health.mail.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.x5.recruitment=INFO
logging.level.org.springframework.security=INFO
