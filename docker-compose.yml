version: '3.8'

services:
  postgres:
    image: postgres:17.7
    container_name: x5-recruitment-db
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: x5-recruitment-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recruitment
      SPRING_DATASOURCE_USERNAME: recruitment
      SPRING_DATASOURCE_PASSWORD: recruitment123
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
